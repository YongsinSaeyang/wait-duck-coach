<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc"><title id="title">三條執行路徑的期末資產</title><desc id="desc">兩條路徑皆為十萬元且零報酬，但一條未建立模擬單，另一條建立後未成交。成交路徑期末為九萬一千六百七十元。</desc><rect width="760" height="390" rx="14" fill="#f0eee4"/><g font-family="sans-serif" fill="#263d34"><text x="24" y="35" font-size="18">同樣 0%，停在不同的執行階段</text><text x="24" y="90" font-size="15">A — 資金不足</text><text x="24" y="114" fill="#647064" font-size="12">未進場</text><rect x="260" y="73" width="340.00" height="32" rx="6" fill="#c1cdb0"/><text x="610.00" y="94" font-size="14">100,000</text><text x="24" y="195" font-size="15">B — 無可用流動性</text><text x="24" y="219" fill="#647064" font-size="12">建立模擬單但未成交</text><rect x="260" y="178" width="340.00" height="32" rx="6" fill="#e9c99a"/><text x="610.00" y="199" font-size="14">100,000</text><text x="24" y="300" font-size="15">C — 一股單位</text><text x="24" y="324" fill="#647064" font-size="12">模擬成交後持有</text><rect x="260" y="283" width="311.68" height="32" rx="6" fill="#739578"/><text x="581.68" y="304" font-size="14">91,670</text><text x="24" y="368" fill="#647064" font-size="12">教學假設 · 本金 100,000 元 · 期末資產單位為元 · 無費用</text></g></svg>
